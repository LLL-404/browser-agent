# =============================================================================
# CI/CD Pipeline — 唯一规范源
# 修改 CI 配置请直接改动此文件。
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ====== 代码质量检查 ======
  lint:
    name: 🔍 Code Quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest

      - name: Ruff Linting (代码风格)
        run: ruff check . --output-format=github

      - name: Ruff Formatting (格式化)
        run: ruff format --check .

      - name: MyPy Type Checking (类型检查)
        run: mypy agent/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # ====== 单元测试 ======
  test:
    name: 🧪 Unit Tests
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=agent --cov=modes --cov=shared --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ====== 安全扫描 ======
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety bandit

      - name: Check dependencies for vulnerabilities
        run: safety check -r requirements.txt || true

      - name: Bandit security linter
        run: bandit -r agent/ -ll || true

  # ====== 构建验证 ======
  build:
    name: 📦 Build Verification
    runs-on: windows-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: python -c "from browser_agent.core.agent import BrowserAgent; from browser_agent.mcp import server; print('✅ All imports successful')"

      - name: Health check
        run: python -c "import asyncio; from browser_agent.core.session import cleanup_old_profiles; print('health_check: ok')"
        continue-on-error: true
