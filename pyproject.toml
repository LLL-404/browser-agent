[project]
name = "browser-agent"
version = "3.0.0"
description = "浏览器自动化 AI Agent 框架 — MCP Server + CLI + 多模式扩展"
requires-python = ">=3.11"
authors = [{name = "Your Name"}]
license = {text = "MIT"}
dependencies = [
    "playwright>=1.40.0",
    "camoufox>=0.3.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["browser_agent*"]

# ====== Entry Points (CLI Commands) ======
[project.scripts]
agent = "browser_agent.cli.main:main"

# ====== Ruff 配置 ======
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",   # 行过长(由 formatter 处理)
    "N806",   # 变量名大写(配置字典常用)
    "N802",   # 函数名大写(handler 函数)
    "B008",   # 函数默认参数可变值(async handler 常用)
    "RUF001", # 中文字符串含全角标点(中文排版需要)
    "RUF002", # 中文文档字符串含全角标点(中文排版需要)
    "RUF003", # 中文注释含全角标点(中文排版需要)
]

[tool.ruff.lint.isort]
known-first-party = ["browser_agent", "modes", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ====== MyPy 配置 ======
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["playwright.*", "camoufox.*", "mcp.*"]
ignore_missing_imports = true

# ====== Pytest 配置 ======
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ====== Coverage 配置 ======
[tool.coverage.run]
source = ["src/browser_agent", "modes", "shared"]
relative_files = true
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 20

[tool.coverage.paths]
source = ["src/browser_agent", "modes", "shared"]
project = ["src"]

[tool.coverage.html]
directory = "htmlcov"
title = "Browser Agent - Test Coverage"
