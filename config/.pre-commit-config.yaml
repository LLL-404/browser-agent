# Pre-commit hooks 配置
# 安装: pip install pre-commit && pre-commit install --config config/.pre-commit-config.yaml
# 运行: pre-commit run --config config/.pre-commit-config.yaml --all-files

repos:
  # ====== Ruff: Python Linting & Formatting ======
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      # Ruff Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Ruff Formatter
      - id: ruff-format

  # ====== MyPy: Type Checking ======
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-requests]
        args: [--ignore-missing-imports, agent/, modes/, shared/]
        pass_filenames: false
        exclude: ^tests/

  # ====== General Checks ======
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # 检查 YAML/JSON 格式
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      # 检查大文件（避免误提交）
      - id: check-added-large-files
        args: ['--maxkb=500']
      # 检查合并冲突标记
      - id: check-merge-conflict
      # 结尾空白行检查
      - id: end-of-file-fixer
      # 尾部空格清理
      - id: trailing-whitespace-fixer
      # 调试语句检测（防止提交断点代码）
      - id: debug-statements
      # 文件名规范
      - id: check-case-conflict

  # ====== Security Scanning ======
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-ll, "-r", "agent/"]
        additional_dependencies: ["bandit[toml]"]

# 排除目录
exclude: |
  (?x)(
    ^\.venv/|
    ^.git/|
    __pycache__|
    \.pytest_cache|
    htmlcov|
    .*\.egg-info
  )

# CI 环境设置
ci:
  autofix_commit_msg: "style: auto-fix by pre-commit"
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autofix_prs: true
  skip: [mypy]  # CI 中跳过 mypy（已在 GitHub Actions 中单独运行）
